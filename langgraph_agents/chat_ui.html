<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper QA System</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232735;
    --border: #2d3142;
    --text: #e4e4e7;
    --text-dim: #9ca3af;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --user-bg: #1e3a5f;
    --bot-bg: #1f2937;
    --success: #22c55e;
    --warn: #eab308;
    --error: #ef4444;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
  }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header-actions { display: flex; gap: 8px; }
  .btn {
    padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); cursor: pointer;
    font-size: 13px; transition: all .15s;
  }
  .btn:hover { background: var(--border); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-hover); }

  /* Main layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Chat panel */
  .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 24px; display: flex;
    flex-direction: column; gap: 16px;
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: var(--radius); line-height: 1.6; font-size: 14px; }
  .msg-user { background: var(--user-bg); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg-bot { background: var(--bot-bg); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg-bot .planner-badge {
    display: inline-flex; gap: 6px; flex-wrap: wrap;
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: var(--surface2); color: var(--text-dim); white-space: nowrap;
  }
  .badge-route { color: var(--accent); border: 1px solid var(--accent); background: transparent; }
  .badge-online { color: var(--success); border: 1px solid var(--success); background: transparent; }
  .badge-quality-SUFFICIENT { color: var(--success); }
  .badge-quality-PARTIAL { color: var(--warn); }
  .badge-quality-INSUFFICIENT { color: var(--error); }
  .msg-bot .papers-list { margin-top: 10px; font-size: 12px; color: var(--text-dim); }
  .papers-list li { margin: 3px 0 3px 16px; }
  .msg-typing { color: var(--text-dim); font-style: italic; }

  /* Input bar */
  .input-bar {
    display: flex; gap: 10px; padding: 16px 24px;
    background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .input-bar input {
    flex: 1; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); font-size: 14px; outline: none;
  }
  .input-bar input:focus { border-color: var(--accent); }
  .input-bar input::placeholder { color: var(--text-dim); }

  /* Side panel */
  .side-panel {
    width: 0; overflow: hidden; transition: width .3s; background: var(--surface);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .side-panel.open { width: 520px; }
  .side-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .side-tabs { display: flex; gap: 4px; }
  .side-tab {
    padding: 6px 14px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 13px;
  }
  .side-tab.active { background: var(--accent); color: #fff; }
  .side-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 4px 8px; }
  .side-body { flex: 1; overflow-y: auto; padding: 12px; }

  /* Log entries */
  .log-entry {
    background: var(--surface2); border-radius: 8px; padding: 12px;
    margin-bottom: 10px; font-size: 13px; line-height: 1.5;
  }
  .log-entry .log-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .log-entry .log-time { color: var(--text-dim); font-size: 11px; }
  .log-entry .log-turn { color: var(--accent); font-weight: 600; font-size: 11px; }
  .log-field { margin: 2px 0; }
  .log-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; }
  .log-value { color: var(--text); word-break: break-word; }
  .log-value.route { color: var(--accent); font-weight: 600; }
  .log-json {
    background: var(--bg); padding: 8px; border-radius: 6px;
    font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 12px;
    overflow-x: auto; max-height: 200px; overflow-y: auto; margin-top: 4px;
    white-space: pre-wrap; color: var(--text-dim);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Markdown-ish rendering */
  .msg-bot p { margin: 6px 0; }
  .msg-bot strong { color: #fff; }
  .msg-bot code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .msg-bot ul, .msg-bot ol { margin: 6px 0 6px 20px; }
  .msg-bot li { margin: 3px 0; }
</style>
</head>
<body>

<div class="header">
  <h1>Paper QA System</h1>
  <div class="header-actions">
    <button class="btn" onclick="newSession()">New Chat</button>
    <button class="btn" onclick="togglePanel('planner')">Planner Log</button>
    <button class="btn" onclick="togglePanel('state')">State Log</button>
    <button class="btn" onclick="clearLogs()" style="color:var(--error)">Clear Logs</button>
  </div>
</div>

<div class="main">
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="msg msg-bot">
        Welcome! I can help you discover, understand, and compare ML/AI research papers.
        Try asking me to recommend papers, explain a method, or compare approaches.
      </div>
    </div>
    <div class="input-bar">
      <input type="text" id="input" placeholder="Ask about papers..." autofocus
             onkeydown="if(event.key==='Enter' && !event.shiftKey) send()">
      <button class="btn btn-accent" onclick="send()">Send</button>
    </div>
  </div>

  <div class="side-panel" id="sidePanel">
    <div class="side-header">
      <div class="side-tabs">
        <button class="side-tab active" id="tabPlanner" onclick="switchTab('planner')">Planner</button>
        <button class="side-tab" id="tabState" onclick="switchTab('state')">State</button>
      </div>
      <button class="side-close" onclick="closePanel()">&times;</button>
    </div>
    <div class="side-body" id="sideBody"></div>
  </div>
</div>

<script>
let currentTab = 'planner';
let panelOpen = false;

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderMarkdown(text) {
  let html = esc(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/`(.+?)`/g, '<code>$1</code>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n- /g, '\n• ');
  html = html.replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

function addMessage(role, content, meta) {
  const el = document.createElement('div');
  el.className = 'msg msg-' + role;
  if (role === 'user') {
    el.textContent = content;
  } else {
    let html = renderMarkdown(content);
    /* Papers reference list is now included in response text by backend */
    if (meta) {
      html += '<div class="planner-badge">';
      html += `<span class="badge badge-route">${esc(meta.planner_route)}</span>`;
      if (meta.do_online_search) html += '<span class="badge badge-online">+online</span>';
      if (meta.retrieval_quality) {
        html += `<span class="badge badge-quality-${esc(meta.retrieval_quality)}">${esc(meta.retrieval_quality)}</span>`;
      }
      html += `<span class="badge">${meta.elapsed}s</span>`;
      html += '</div>';
    }
    el.innerHTML = html;
  }
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth' });
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'msg msg-bot msg-typing';
  el.id = 'typing';
  el.textContent = 'Thinking...';
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth' });
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addMessage('user', msg);
  addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    const data = await res.json();
    removeTyping();
    addMessage('bot', data.response, data);
    if (panelOpen) loadLogs(currentTab);
  } catch (e) {
    removeTyping();
    addMessage('bot', 'Error: ' + e.message, null);
  }
}

async function newSession() {
  await fetch('/api/new', { method: 'POST' });
  document.getElementById('messages').innerHTML = '';
  addMessage('bot', 'New conversation started. How can I help you?', null);
}

function togglePanel(tab) {
  const panel = document.getElementById('sidePanel');
  if (panelOpen && currentTab === tab) {
    closePanel();
    return;
  }
  panel.classList.add('open');
  panelOpen = true;
  switchTab(tab);
}

function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  panelOpen = false;
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabPlanner').classList.toggle('active', tab === 'planner');
  document.getElementById('tabState').classList.toggle('active', tab === 'state');
  loadLogs(tab);
}

async function loadLogs(tab) {
  const body = document.getElementById('sideBody');
  body.innerHTML = '<div style="color:var(--text-dim);padding:20px">Loading...</div>';
  try {
    const res = await fetch(`/api/logs/${tab}`);
    const entries = await res.json();
    if (!entries.length) {
      body.innerHTML = '<div style="color:var(--text-dim);padding:20px">No logs yet. Start chatting!</div>';
      return;
    }
    body.innerHTML = '';
    entries.reverse().forEach(e => {
      if (tab === 'planner') body.innerHTML += renderPlannerEntry(e);
      else body.innerHTML += renderStateEntry(e);
    });
  } catch (err) {
    body.innerHTML = `<div style="color:var(--error);padding:20px">Failed to load: ${esc(err.message)}</div>`;
  }
}

function renderPlannerEntry(e) {
  const online = e.do_online_search ? '<span class="badge badge-online">+online</span>' : '';
  const quality = e.retrieval_quality
    ? `<span class="badge badge-quality-${esc(e.retrieval_quality)}">${esc(e.retrieval_quality)}</span>` : '';
  return `<div class="log-entry">
    <div class="log-header">
      <span class="log-turn">Turn ${e.turn}</span>
      <span class="log-time">${esc(e.timestamp?.slice(11, 19) || '')} | ${e.elapsed_s}s</span>
    </div>
    <div class="log-field"><span class="log-label">Query</span><br><span class="log-value">${esc(e.user_query)}</span></div>
    <div class="log-field"><span class="log-label">Optimized</span><br><span class="log-value">${esc(e.optimized_query || '(same)')}</span></div>
    <div class="log-field"><span class="log-label">Route</span><br>
      <span class="log-value route">${esc(e.route)}</span> ${online} ${quality}
    </div>
    <div class="log-field"><span class="log-label">Reasoning</span><br><span class="log-value">${esc(e.reasoning)}</span></div>
    ${e.retrieval_reasoning ? `<div class="log-field"><span class="log-label">Retrieval Eval</span><br><span class="log-value">${esc(e.retrieval_reasoning)}</span></div>` : ''}
    ${e.suggested_refined_query ? `<div class="log-field"><span class="log-label">Refined Query</span><br><span class="log-value">${esc(e.suggested_refined_query)}</span></div>` : ''}
    <div class="log-field"><span class="log-label">Final Papers</span> <span class="log-value">${e.num_final_papers}</span></div>
  </div>`;
}

function renderStateEntry(e) {
  const state = e.state || {};
  const stateJson = JSON.stringify(state, null, 2);
  const truncated = stateJson.length > 3000 ? stateJson.slice(0, 3000) + '\n...(truncated)' : stateJson;
  return `<div class="log-entry">
    <div class="log-header">
      <span class="log-turn">Turn ${e.turn}</span>
      <span class="log-time">${esc(e.timestamp?.slice(11, 19) || '')} | ${e.elapsed_s}s</span>
    </div>
    <div class="log-field"><span class="log-label">Query</span><br><span class="log-value">${esc(e.user_query)}</span></div>
    <div class="log-json">${esc(truncated)}</div>
  </div>`;
}

async function clearLogs() {
  if (!confirm('Clear all log files?')) return;
  await fetch('/api/logs/clear');
  if (panelOpen) loadLogs(currentTab);
}
</script>
</body>
</html>
